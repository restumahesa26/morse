<body>

    <div class="container">
        <h1 class="header-title">Konverter Kode Morse</h1>
        
        <!-- Navigasi -->
        <nav class="navbar">
            <div class="d-flex justify-content-center w-100">
                <a class="nav-link active mx-3" href="#" id="nav-encrypt">Enkripsi</a>
                <a class="nav-link mx-3" href="#" id="nav-decrypt">Dekripsi</a>
            </div>
        </nav>

        <!-- Bagian Enkripsi -->
        <section id="encrypt-section" class="content-section">
            <div class="mb-3">
                <label for="text-input" class="form-label">Masukkan Teks Anda:</label>
                <textarea class="form-control" id="text-input" rows="5" placeholder="Ketik sesuatu di sini..."></textarea>
            </div>
            <div class="output-section">
                <div class="d-flex justify-content-between align-items-center mb-2">
                     <h2 class="form-label mb-0">Hasil Kode Morse:</h2>
                     <button class="btn btn-sm btn-copy" id="copy-morse-btn">Salin</button>
                </div>
                <div class="output-box" id="morse-output">...</div>
            </div>
        </section>
        
        <!-- Bagian Dekripsi -->
        <section id="decrypt-section" class="content-section">
             <div class="mb-3">
                <label for="morse-input" class="form-label">Masukkan Kode Morse:</label>
                <textarea class="form-control" id="morse-input" rows="5" placeholder="Ketik atau tempel kode morse di sini... pisahkan huruf dengan spasi dan kata dengan '/'. Contoh: .... . .-.. .-.. --- / -.. ..- -. .. .-" ></textarea>
            </div>
            <div class="output-section">
                <div class="d-flex justify-content-between align-items-center mb-2">
                     <h2 class="form-label mb-0">Hasil Teks Biasa:</h2>
                     <button class="btn btn-sm btn-copy" id="copy-text-btn">Salin</button>
                </div>
                <div class="output-box" id="text-output" style="font-family: 'Special Elite', cursive; font-size: 1.5rem; text-align:left;">...</div>
            </div>
        </section>

        <p class="footer-text">Dibuat dengan sentuhan nostalgia</p>
